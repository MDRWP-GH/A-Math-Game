name: EditMode tests

# The bugs that reached main were all in code paths no test covered and no
# pipeline ran. This workflow makes the existing suite a merge gate.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  editmode:
    name: EditMode
    runs-on: ubuntu-latest
    steps:
      # game-ci cannot start Unity without a license file or serial. Skip
      # instead of failing red while UNITY_LICENSE is not configured.
      - name: Unity license secret missing
        if: ${{ secrets.UNITY_LICENSE == '' }}
        run: |
          echo "::warning::UNITY_LICENSE is not set. EditMode tests were skipped."
          echo "Add UNITY_LICENSE, UNITY_EMAIL, and UNITY_PASSWORD in Settings > Secrets and variables > Actions."

      # Unity 6 editor images are larger than a stock GitHub runner's free
      # disk. Clear unused toolchains before checkout/pull so docker has room.
      - name: Free disk space
        if: ${{ secrets.UNITY_LICENSE != '' }}
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - uses: actions/checkout@v4
        if: ${{ secrets.UNITY_LICENSE != '' }}
        with:
          lfs: true

      # Unity's import cache; without it every run re-imports the whole project.
      - uses: actions/cache@v4
        if: ${{ secrets.UNITY_LICENSE != '' }}
        with:
          path: Library
          key: Library-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-

      # Requires UNITY_LICENSE (contents of a .ulf activation file),
      # UNITY_EMAIL and UNITY_PASSWORD in the repository secrets.
      - uses: game-ci/unity-test-runner@v4
        if: ${{ secrets.UNITY_LICENSE != '' }}
        id: tests
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 6000.3.19f1
          testMode: editmode
          artifactsPath: test-results
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: EditMode results

      - uses: actions/upload-artifact@v4
        if: ${{ always() && secrets.UNITY_LICENSE != '' }}
        with:
          name: test-results
          path: test-results
          if-no-files-found: ignore

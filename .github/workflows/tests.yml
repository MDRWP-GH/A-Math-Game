name: EditMode tests

# The bugs that reached main were all in code paths no test covered and no
# pipeline ran. This workflow makes the existing suite a merge gate.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  editmode:
    name: EditMode
    runs-on: ubuntu-latest
    steps:
      # Must stay first: this remounts the workspace onto a merged LVM volume
      # so the Unity 6 image has somewhere to unpack. Stock runner free space
      # is not enough; docker exit 125 here was "no space left on device".
      - name: Maximize build space
        if: ${{ secrets.UNITY_LICENSE != '' }}
        uses: easimon/maximize-build-space@v10
        with:
          root-reserve-mb: 8192
          swap-size-mb: 2048
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'

      - name: Point Docker at the large volume
        if: ${{ secrets.UNITY_LICENSE != '' }}
        run: |
          sudo systemctl stop docker.socket docker containerd
          sudo mkdir -p "${GITHUB_WORKSPACE}/.docker-data"
          printf '%s\n' "{\"data-root\":\"${GITHUB_WORKSPACE}/.docker-data\"}" | sudo tee /etc/docker/daemon.json
          sudo systemctl start docker
          docker info | grep 'Docker Root Dir'
          df -h

      # game-ci cannot start Unity without a license file or serial. Skip
      # instead of failing red while UNITY_LICENSE is not configured.
      - name: Unity license secret missing
        if: ${{ secrets.UNITY_LICENSE == '' }}
        run: |
          echo "::warning::UNITY_LICENSE is not set. EditMode tests were skipped."
          echo "Add UNITY_LICENSE, UNITY_EMAIL, and UNITY_PASSWORD in Settings > Secrets and variables > Actions."

      - uses: actions/checkout@v4
        if: ${{ secrets.UNITY_LICENSE != '' }}
        with:
          lfs: true

      # Unity's import cache; without it every run re-imports the whole project.
      - uses: actions/cache@v4
        if: ${{ secrets.UNITY_LICENSE != '' }}
        with:
          path: Library
          key: Library-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-

      # Requires UNITY_LICENSE (contents of a .ulf activation file),
      # UNITY_EMAIL and UNITY_PASSWORD in the repository secrets.
      - uses: game-ci/unity-test-runner@v4
        if: ${{ secrets.UNITY_LICENSE != '' }}
        id: tests
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 6000.3.19f1
          customImage: unityci/editor:ubuntu-6000.3.19f1-base-3
          testMode: editmode
          artifactsPath: test-results
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: EditMode results

      - uses: actions/upload-artifact@v4
        if: ${{ always() && secrets.UNITY_LICENSE != '' }}
        with:
          name: test-results
          path: test-results
          if-no-files-found: ignore
